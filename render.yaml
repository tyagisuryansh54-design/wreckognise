# Render blueprint -- deploys the Wreckognise API.
#
# Render's free web services sleep after 15 minutes idle and get a fresh
# filesystem on every deploy, so surveys (held in memory) and rendered PNGs
# (written to disk) do not survive a restart. That is fine for a demo: the
# dashboard's "Explore Live Scan" button rebuilds everything in seconds.
# For anything durable, move to a paid instance with a persistent disk and
# swap `services/store.py` for a real database.

services:
  - type: web
    name: wreckognise-api
    runtime: python
    plan: free
    region: singapore          # closest region to an India-based demo
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Keep this at 1. The survey store is per-process, so a second instance
    # would answer /detect for a survey it never ingested.
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: WRECKOGNISE_DEBUG
        value: "false"
      # Switches on HSTS, the Content-Security-Policy, and the /docs lockdown.
      # Without it the hardening middleware runs in its development posture and
      # sends neither header -- the app still works, it is just not hardened,
      # which is the failure mode that goes unnoticed.
      - key: WRECKOGNISE_ENVIRONMENT
        value: "production"
      # Throttle budget for the expensive routes (decode / denoise / inference),
      # per client address per 5 minutes. Left overridable because a demo behind
      # a single venue NAT puts every viewer on one address: if a room full of
      # people is going to try the dashboard at once, raise this first.
      - key: WRECKOGNISE_RATE_LIMIT_HEAVY
        sync: false
      # HMAC key for artefact URLs. Without it the key is generated per
      # process, so every waterfall link minted before a restart stops
      # verifying -- and a free instance restarts every time it sleeps.
      # generateValue makes Render mint one once and keep it.
      - key: WRECKOGNISE_SECRET_KEY
        generateValue: true
      # Set this to your deployed dashboard origin after the frontend is live.
      - key: WRECKOGNISE_CORS_ORIGINS
        sync: false
      # Optional: lets Vercel/Netlify preview deploys through too.
      - key: WRECKOGNISE_CORS_ORIGIN_REGEX
        sync: false
